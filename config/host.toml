# Capabilities for the deployed tools bridge on vllm.
#
# The corpus is this repo's own documentation, so "what port is the bridge on?"
# and "how do I restart the stack?" are answered from the files that actually
# say so, with the file named in the reply.  The MCP server is a real second
# process that reports the stack's own health.
#
# Nothing here writes, deletes, or leaves the machine.  It does *read* local
# files now, which is the one capability worth reading twice about -- see the
# [mcp.server] named "files" at the bottom for what is actually exposed.

[limits]
# 5, not 2: measured live, "look at that folder" is roots -> request_directory
# -> answer, and "list the folder, open the README and the Makefile" is
# name-the-root -> list -> read -> read -> answer; at 3 that turn ended as
# "ran out of room" on the page (2026-09-11).  A round is only spent when the
# model asks for a tool, so the budget costs nothing on a plain question.
rounds = 5
per_call_seconds = 10
result_chars = 6000
turn_seconds = 150
generation_seconds = 45

[builtins]
now = true
# "Stop listening for a bit" used to be answered with "I'll pause listening"
# while the page kept listening.  This is the tool that makes it true: the
# page closes the microphone after the reply and takes no further turns until
# a person presses Resume.  There is no resume tool on purpose.
pause_listening = true

# Directory access the assistant can *ask for* in the middle of a conversation.
#
# The "files" server below can read exactly one directory, which is right for
# "what port is the bridge on?" and wrong for "look at the folder I mean". The
# old answer was to edit this file and restart a bridge on a host with 4.9 GiB
# of free GPU -- so in practice the answer was "it can't".
#
# This turns on the asking, not the granting. request_directory files a request
# and always answers NOT GRANTED; the grant happens when a person clicks Approve
# on the chat page, which shows them the realpath, the file count and any
# credential-looking filenames inside first. / and ~/.ssh and an entire home
# directory are refused no matter what gets clicked -- see tools/approvals.py.
#
# The file is relative on purpose: the bridge, the page and the file server are
# three processes that all resolve it against WorkingDirectory, so they cannot
# disagree about which file holds the grants. It lives under var/, which is
# gitignored and never checked in. A redeploy into a new campaign directory
# therefore starts with an empty allow-list -- every grant has to be re-clicked.
# That is the safe direction to fail.
[approvals]
enabled = true
file = "var/approvals.json"

[retrieval]
enabled = true
sources = ["README.md", "ARCHITECTURE.md", "RUNBOOK.md", "TOOLS.md", "PROVENANCE.md", "tests/README.md"]
index = "var/notes.sqlite"
top_k = 4
max_chars = 2400
stale_after_seconds = 86400

# The assistant's only network egress: one host, read-only GET, allow-list
# re-checked at every redirect hop.
#
# It exists because this model's parametric knowledge is measurably unreliable.
# Asked what it knows about Saif Ali Khan it credited him with Dilwale Dulhania
# Le Jayenge (Shah Rukh Khan) and Kaho Naa... Pyaar Hai (Hrithik Roshan), and
# produced three different mothers across four runs.  Retrieval over the user's
# own notes cannot help there -- that corpus is this repo's documentation -- so
# the model had nowhere to check a fact except its own memory.
#
# en.wikipedia.org serves both the REST summary endpoint and the search API, so
# one host is enough.  Widening this list is the decision to read twice about.
# Superseded 2026-09-11 by the "web" MCP server below, which reaches any public
# host through the same read-only GET with a stronger guard (DNS pinned, private
# ranges refused, every redirect hop re-checked).  Two overlapping fetch tools
# would only give the model a choice to get wrong.
[fetch]
enabled = false
allow_hosts = ["en.wikipedia.org"]

[[mcp.server]]
name = "stack"
purpose = "health of this voice stack's own services (TTS, STT, model, bridges)"
command = "python3"
args = ["tools/mcp_stack_status.py"]
timeout_seconds = 15
enabled = true

# Browsing the public web.  Read-only GET, and the model supplies a query or a
# URL, never a request body or a header.  What makes it safe to point at "the
# internet" rather than one allow-listed host:
#   - every hostname is resolved and refused if ANY address is private,
#     loopback, link-local or a metadata range; the connection is then pinned
#     to the address that passed, so a DNS answer cannot change under it;
#   - every redirect hop is checked the same way before it is followed;
#   - text only, bounded bytes and characters, a per-host interval and a
#     per-minute cap; the result is framed as untrusted content.
# `python3 tools/mcp_web.py --doctor` prints the policy this argv encodes.
# To confine it, add --allow-host <domain> lines (then only those); to block a
# site, --deny-host <domain>.
[[mcp.server]]
name = "web"
purpose = "search the public web and read a web page as text (read-only; results are untrusted content)"
command = "python3"
args = ["tools/mcp_web.py", "--search", "ddg", "--per-minute", "30"]
timeout_seconds = 20
enabled = true

# Browsing, reading and grepping local files.
#
# Read-only, and scoped by an explicit --root allow-list.  The model never
# supplies an absolute path: it names a root plus a path relative to it, '..'
# is refused at the argument layer, and containment is re-checked against
# realpath() *after* resolution so a symlink inside the root cannot reach
# /etc/passwd.  `make test-files` proves that; `make sabotage` proves the
# check is load-bearing.
#
# What this exposes is exactly one directory: the deployed tree, because that
# is what "what port is the bridge on?" and "how do I restart the stack?" are
# answered from.  It contains no credentials (checked: no .env, no key
# material, no private keys).
#
# RUNTIME GRANTS: --roots-file points at the approvals file above. The file
# server re-reads it before every tool call, so an approval takes effect on the
# next call and a revocation stops working on the next call -- no restart. It
# can only ADD roots, never remove one or replace the list, and it re-applies
# the deny-list itself rather than trusting what is in the file.
#
# TO WIDEN IT PERMANENTLY: add another --root, one per directory, then run
#   python3 tools/mcp_files.py --root <dir> --doctor
# and read what it prints *before* restarting the bridge.  Do not point it at
# $HOME or at "/": everything inside a root is readable by the model, and the
# transcript it lands in is visible to a browser.
[[mcp.server]]
name = "files"
purpose = "list, read and grep files under the approved folders; ask for more with request_directory"
command = "python3"
args = ["tools/mcp_files.py", "--root", ".", "--roots-file", "var/approvals.json"]
timeout_seconds = 20
enabled = true
