# Capabilities for the deployed tools bridge on vllm.
#
# The corpus is this repo's own documentation, so "what port is the bridge on?"
# and "how do I restart the stack?" are answered from the files that actually
# say so, with the file named in the reply.  The MCP server is a real second
# process that reports the stack's own health.
#
# The workspace server directly reads/writes files and runs short shell commands
# on codex. The files server remains read-only on this GPU bridge host.

[limits]
# 5, not 2: measured live, "look at that folder" is roots -> request_directory
# -> answer, and "list the folder, open the README and the Makefile" is
# name-the-root -> list -> read -> read -> answer; at 3 that turn ended as
# "ran out of room" on the page (2026-09-11).  A round is only spent when the
# model asks for a tool, so the budget costs nothing on a plain question.
rounds = 5
per_call_seconds = 10
result_chars = 6000
turn_seconds = 600
generation_seconds = 600

# The bridge host and the user's project host have different disks. Routine
# project operations use direct tools over SSH, without another model session.
[prompt]
where = [
  "The user's projects, repositories, /mnt and home directory are on codex. Use mcp__workspace__list_directory, read_file, write_file, make_directory and run_shell there for routine file operations and short commands. These tools execute directly without Claude Code.",
  "Your default working directory is /mnt/voice-workspace on codex. Save new notes, lists, documents and other output there unless the user names another location. Relative paths resolve there. For existing projects, use the project's actual path rather than copying it into your workspace.",
  "Questions about your home directory, current directory or account refer to the workspace tools on codex. Before answering, use mcp__workspace__run_shell to inspect HOME, pwd or id -un as appropriate. HOME is the OS account's home; /mnt/voice-workspace is the separate default working directory. Earlier assistant claims about these paths are not evidence.",
  "The files tools and search_notes see only this bridge host: the deployed voice-stack tree, its docs, and folders approved on the page. They cannot access the user's project machine.",
  "Basic computer tasks use workspace tools. Delegate substantial coding or explicit Claude requests to Claude Code. For Codex, use named-session tools: list_sessions, create_session, select_session, send, status, steer, interrupt. Unnamed Codex follow-ups use this conversation's selected session. Background updates never select a session. Verify progress with tools; accepted is not completed.",
  "If workspace tools are unavailable, say so; do not silently send routine file or shell work to Claude Code. The workspace shell is for short commands, with an eight-second maximum; do not start background jobs to evade its timeout.",
]

[builtins]
now = true
# "Stop listening for a bit" used to be answered with "I'll pause listening"
# while the page kept listening.  This is the tool that makes it true: the
# page closes the microphone after the reply and takes no further turns until
# a person presses Resume.  There is no resume tool on purpose.
pause_listening = true

# Directory access the assistant can *ask for* in the middle of a conversation.
#
# The "files" server below can read exactly one directory, which is right for
# "what port is the bridge on?" and wrong for "look at the folder I mean". The
# old answer was to edit this file and restart a bridge on a host with 4.9 GiB
# of free GPU -- so in practice the answer was "it can't".
#
# This turns on the asking, not the granting. request_directory files a request
# and always answers NOT GRANTED; the grant happens when a person clicks Approve
# on the chat page, which shows them the realpath, the file count and any
# credential-looking filenames inside first. / and ~/.ssh and an entire home
# directory are refused no matter what gets clicked -- see tools/approvals.py.
#
# The file is relative on purpose: the bridge, the page and the file server are
# three processes that all resolve it against WorkingDirectory, so they cannot
# disagree about which file holds the grants. It lives under var/, which is
# gitignored and never checked in. A redeploy into a new campaign directory
# therefore starts with an empty allow-list -- every grant has to be re-clicked.
# That is the safe direction to fail.
[approvals]
enabled = true
file = "var/approvals.json"

[retrieval]
enabled = true
sources = ["README.md", "ARCHITECTURE.md", "RUNBOOK.md", "TOOLS.md", "PROVENANCE.md", "tests/README.md"]
index = "var/notes.sqlite"
top_k = 4
max_chars = 2400
stale_after_seconds = 86400

# The assistant's only network egress: one host, read-only GET, allow-list
# re-checked at every redirect hop.
#
# It exists because this model's parametric knowledge is measurably unreliable.
# Asked what it knows about Saif Ali Khan it credited him with Dilwale Dulhania
# Le Jayenge (Shah Rukh Khan) and Kaho Naa... Pyaar Hai (Hrithik Roshan), and
# produced three different mothers across four runs.  Retrieval over the user's
# own notes cannot help there -- that corpus is this repo's documentation -- so
# the model had nowhere to check a fact except its own memory.
#
# en.wikipedia.org serves both the REST summary endpoint and the search API, so
# one host is enough.  Widening this list is the decision to read twice about.
# Superseded 2026-09-11 by the "web" MCP server below, which reaches any public
# host through the same read-only GET with a stronger guard (DNS pinned, private
# ranges refused, every redirect hop re-checked).  Two overlapping fetch tools
# would only give the model a choice to get wrong.
[fetch]
enabled = false
allow_hosts = ["en.wikipedia.org"]

[[mcp.server]]
name = "stack"
purpose = "health of this voice stack's own services (TTS, STT, model, bridges)"
command = "python3"
args = ["tools/mcp_stack_status.py"]
timeout_seconds = 15
enabled = true

# Browsing the public web.  Read-only GET, and the model supplies a query or a
# URL, never a request body or a header.  What makes it safe to point at "the
# internet" rather than one allow-listed host:
#   - every hostname is resolved and refused if ANY address is private,
#     loopback, link-local or a metadata range; the connection is then pinned
#     to the address that passed, so a DNS answer cannot change under it;
#   - every redirect hop is checked the same way before it is followed;
#   - text only, bounded bytes and characters, a per-host interval and a
#     per-minute cap; the result is framed as untrusted content.
# `python3 tools/mcp_web.py --doctor` prints the policy this argv encodes.
# To confine it, add --allow-host <domain> lines (then only those); to block a
# site, --deny-host <domain>.
[[mcp.server]]
name = "web"
purpose = "search the public web and read a web page as text (read-only; results are untrusted content)"
command = "python3"
args = ["tools/mcp_web.py", "--search", "ddg", "--per-minute", "30"]
timeout_seconds = 20
enabled = true

# Browsing, reading and grepping local files.
#
# Read-only, and scoped by an explicit --root allow-list.  The model never
# supplies an absolute path: it names a root plus a path relative to it, '..'
# is refused at the argument layer, and containment is re-checked against
# realpath() *after* resolution so a symlink inside the root cannot reach
# /etc/passwd.  `make test-files` proves that; `make sabotage` proves the
# check is load-bearing.
#
# What this exposes is exactly one directory: the deployed tree, because that
# is what "what port is the bridge on?" and "how do I restart the stack?" are
# answered from.  It contains no credentials (checked: no .env, no key
# material, no private keys).
#
# RUNTIME GRANTS: --roots-file points at the approvals file above. The file
# server re-reads it before every tool call, so an approval takes effect on the
# next call and a revocation stops working on the next call -- no restart. It
# can only ADD roots, never remove one or replace the list, and it re-applies
# the deny-list itself rather than trusting what is in the file.
#
# TO WIDEN IT PERMANENTLY: add another --root, one per directory, then run
#   python3 tools/mcp_files.py --root <dir> --doctor
# and read what it prints *before* restarting the bridge.  Do not point it at
# $HOME or at "/": everything inside a root is readable by the model, and the
# transcript it lands in is visible to a browser.
# Guiding Claude Code by voice.
#
# `send` hands the user's words to a long-lived Claude Code session and returns
# at once; `updates` says what it has finished since last asked, as a spoken
# line that Claude itself wrote for the speech engine (the Markdown report
# travels only when `detail` is asked for).  TOOLS.md, "Guiding Claude Code".
#
# TRANSPORT: the session runs on codex, where the repositories and the
# logged-in `claude` are, not on this GPU host.  The MCP child here is `ssh`,
# and stdio is the wire.  The key it uses (`~/.ssh/id_ed25519_voice_claude`,
# alias `codex-claude` in ~/.ssh/config on this host) is authorized on codex
# with `restrict,command="python3 .../tools/mcp_claude.py ..."`, so it can run
# that one server and nothing else -- no shell, no forwarding, no pty.  The
# server's own argv (working directory, permission mode, which `claude`) is
# therefore fixed on codex, in ~/.ssh/authorized_keys, not here.
#
# PERMISSIONS are Claude Code's own, in bypass mode by the operator's decision
# (2026-09-11): the model behind the session is trusted to ask before doing
# anything hard to undo; nothing on this side second-guesses it.  The transcript
# is passed verbatim inside a frame that says it came from speech recognition.
#
# PUSH: the forced command on codex ends in `--push`, so a finished turn comes
# up this pipe as a JSON-RPC notification the moment it lands.  The bridge
# forwards it to every open page over GET /events (server-sent events) and the
# page speaks it when it is nobody's turn.  Nothing polls.  Without --push the
# page hears about finished work only when someone asks.
[[mcp.server]]
name = "claude"
purpose = "delegate only substantial engineering/coding or explicit Claude Code requests; basic computer tasks use workspace tools. send starts work; updates reports progress; stop cancels Claude work without pausing the microphone"
command = "ssh"
args = ["-T", "codex-claude"]
timeout_seconds = 20
enabled = true

# Named Codex sessions (2026-09-20), using App Server and the pinned q38f
# profile: Qwen3.8-Flash-Next on port8038. The voice router uses Q38-27B on8080.
# A dedicated SSH key/alias codex-sessions is forced to mcp_codex_sessions.py
# on codex. SQLite state lives in /mnt/voice-workspace/.codex-sessions.
# The existing full-access policy is retained; this is not a filesystem sandbox.
# Up to three managed workers, with nested agent spawning disabled. The older
# one-thread adapter/key remain available for rollback. See TOOLS.md.
[[mcp.server]]
name = "codex"
purpose = "manage named Codex coding sessions on the user's project machine: create/list/select, send a task, steer running work, read status/updates, answer a pending question, interrupt or archive. The configured local Flash-Next profile stays pinned. Routine files and shell use workspace tools"
command = "ssh"
args = ["-T", "codex-sessions"]
timeout_seconds = 20
enabled = true

[[mcp.server]]
name = "files"
purpose = "list, read and grep files on this bridge host only (the deployed voice-stack tree and folders approved on the page); use workspace tools for the user's projects on codex"
command = "python3"
args = ["tools/mcp_files.py", "--root", ".", "--roots-file", "var/approvals.json"]
timeout_seconds = 20
enabled = true

# Direct filesystem and shell operations on the project machine. This SSH
# alias uses its own forced-command key, running
# mcp_workspace.py --cwd /mnt/voice-workspace.
# See TOOLS.md for transport setup. cwd is a starting directory, not a sandbox:
# calls have the SSH account's filesystem and shell permissions.
[[mcp.server]]
name = "workspace"
purpose = "directly list/read/write files, create directories and run short shell commands on codex, the user's project machine; no coding-agent session. Default working and output directory: /mnt/voice-workspace. Shell timeout at most eight seconds"
command = "ssh"
args = ["-T", "codex-workspace"]
timeout_seconds = 10
enabled = true
